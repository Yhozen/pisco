# Licence and copyright of every file, for `reuse lint` (https://reuse.software). People: read LICENSING.md.
# A file's own SPDX-License-Identifier line is used where it has one; the last matching entry here fills the rest.
version = 1

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2026 PISCO contributors"
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = "crates/shaders/**"
SPDX-FileCopyrightText = ["2026 XCL contributors (https://github.com/ivall/xcl)", "2026 PISCO contributors"]
SPDX-License-Identifier = "GPL-2.0-only"

[[annotations]]
path = "crates/shaders/src/rdna2_spec.rs"
SPDX-FileCopyrightText = ["2026 Advanced Micro Devices, Inc.", "2026 XCL contributors (https://github.com/ivall/xcl)"]
SPDX-License-Identifier = "GPL-2.0-only AND MIT"

[[annotations]]
path = "rt/gdk/d3d12_layout.gen.h"
SPDX-FileCopyrightText = "Microsoft Corporation"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["rt/windows-x86/d3d9_layout.gen.h", "rt/windows-x86/dinput8_layout.gen.h"]
SPDX-FileCopyrightText = "Wine contributors (the d3d9.h and dinput.h of mingw-w64 are Wine's)"
SPDX-License-Identifier = "LGPL-2.1-or-later"

[[annotations]]
path = "tests/data/llvm-amdgpu/**"
precedence = "override"
SPDX-FileCopyrightText = "LLVM contributors"
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

[[annotations]]
path = "rt/windows-x86/third_party/stb_truetype.h"
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

[[annotations]]
path = "rt/windows-x86/third_party/stb_vorbis.c"
precedence = "override"
SPDX-FileCopyrightText = "2017 Sean Barrett"
SPDX-License-Identifier = "MIT OR Unlicense"

[[annotations]]
path = "rt/windows-x86/third_party/minimp3.h"
precedence = "override"
SPDX-FileCopyrightText = "lieff (https://github.com/lieff/minimp3)"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "rt/windows-x86/fonts/**"
precedence = "override"
SPDX-FileCopyrightText = ["2010 Google Corporation", "2012 Red Hat, Inc."]
SPDX-License-Identifier = "OFL-1.1"
