# base/linux-x64:1, what a Linux x86-64 title is built FROM (docs/images.md): one statically linked ELF, the parts of
# the core that imitate no system (the lifted functions' table, the virtual CPU, memory, the clock) and the Linux
# runtime (rt/linux-x64/: the start of a process, its system calls, the files it finds).
name = "base/linux-x64"
version = 1
platform = "linux-x64"
stability = "stable"
architecture = "amd64"   # as OCI names it: x86-64
os = "linux"

[cpu]
# what a recipe without [cpu] gets: every feature the lifter supports
features = ["fpu", "tsc", "cx8", "cmov", "mmx", "fxsr", "sse", "sse2", "sse3", "ssse3", "sse4.1", "sse4.2", "popcnt", "cx16", "pclmul"]

[impl]
# pisco's: the runtime's sources, paths from the repository's root, `*` within a file name
sources = ["rt/builtins.c", "rt/core.c", "rt/clock.c", "rt/linux-x64/*.c"]
opt = "-O2"
