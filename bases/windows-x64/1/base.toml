# base/windows-x64:1, what a 64-bit Windows desktop title is built FROM (docs/images.md): the core runtime, the
# libraries it shares with the Xbox Series runtime (rt/gdk/: D3D12, DXGI, XAudio2, XGameRuntime, GameInput, the title's window) and
# its own (rt/windows-x64/: DXGI's factory and swap chains, the PC GDK's objects).
name = "base/windows-x64"
version = 1
platform = "windows-x64"
stability = "stable"
architecture = "amd64"   # as OCI names it: x86-64
os = "windows"
# the DLLs this base answers for without a library (docs/spec/base.md): tests/run.sh layout checks the list
provides = ["advapi32.dll", "d3d12.dll", "d3d12_xs.dll", "d3dcompiler_47.dll", "dwmapi.dll", "dxgi.dll", "gameinput.dll", "kernel32.dll", "mfplat.dll", "msvcrt.dll", "ntdll.dll", "ole32.dll", "oleaut32.dll", "shell32.dll", "ucrtbase.dll", "user32.dll", "windowscodecs.dll", "xaudio2_9.dll", "xgameruntime.dll"]

[cpu]
# what a recipe without [cpu] gets: every feature the lifter supports
features = ["fpu", "tsc", "cx8", "cmov", "mmx", "fxsr", "sse", "sse2", "sse3", "ssse3", "sse4.1", "sse4.2", "popcnt", "cx16", "pclmul"]

[impl]
# pisco's: the runtime's sources, paths from the repository's root, `*` within a file name
sources = ["rt/*.c", "rt/gdk/*.c", "rt/windows-x64/*.c"]
opt = "-O2"

[registry]
'HKLM\Software\Microsoft\Windows NT\CurrentVersion' = { ProductName = "Windows 10 Pro", CurrentVersion = "6.3", CurrentBuildNumber = "19045", CurrentMajorVersionNumber = 10, CurrentMinorVersionNumber = 0 }
'HKLM\Software\Microsoft\Windows\CurrentVersion' = { ProgramFilesDir = 'C:\Program Files', CommonFilesDir = 'C:\Program Files\Common Files' }

[files]
dir = "files"
dirs = ['WINDOWS\Temp', 'WINDOWS\System32', 'Users\player', 'Program Files\Common Files']
system32 = 'WINDOWS\System32'
