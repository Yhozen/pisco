# doomgeneric with Freedoom's IWAD, built as an Xbox Series app by tests/gfx/doom.sh (out/doom/game: doom.exe,
# freedoom1.wad and its shaders), as an image FROM the Xbox Series base (tests/images.sh builds it twice and runs it).
schema = 1
name = "doom"
from = "base/xbox-series:1"

[about]
display_name = "Doom (doomgeneric with Freedoom)"
revision = 1

[[input]]
# the folder tests/gfx/doom.sh builds; no sha256: whatever it made
id = "root"
kind = "folder"
file = "../../out/doom/game"
built_by = "fixtures/doom/build.sh"

[[extract]]
kind = "folder"
input = "root"

[run]
exe = 'C:\Games\doom\doom.exe'
display = "1920x1080"
