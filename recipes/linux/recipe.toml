# SPDX-License-Identifier: GPL-2.0-or-later
# Linux itself as a title (docs/linux.md): the kernel tools/build-linux.sh builds from kernel.org's source, lifted with
# the busybox of its initramfs into one module, on the machine rt/microvm-x64 imitates. /init's programs print what
# they print on QEMU (traces/programs.txt). No sha256: built on this machine from checked sources, the files'
# bytes depend on the compiler's.
schema = 1
name = "linux"
from = "base/microvm-x64:1"

[about]
display_name = "Linux"
version = "6.18.65"
revision = 1

[[input]]
id = "root"
kind = "folder"
file = "../../out/linux/root"
built_by = "tools/build-linux.sh"

[[extract]]
kind = "folder"
input = "root"
app = "/"

[permissions]
# its virtio network device, when a run asks for it (SW_NET=1: tests/run.sh net)
network = true

[run]
kernel = "/vmlinux"
initrd = "/initramfs.cpio"
cmdline = "console=ttyS0,115200 earlyprintk=serial,ttyS0,115200 panic=-1 no_timer_check vdso=0 tsc=reliable 8250.nr_uarts=1 norandmaps"

[hints.pisco]
split = 16
programs = ["/busybox", "/hello", "/fastfetch", "/perl"]
# each in a wasm module of its own, not linked with the kernel: bash's licence (GPL-3.0-or-later) is not the kernel's
modules = ["/bash"]
