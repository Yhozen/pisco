# SPDX-License-Identifier: GPL-2.0-or-later
# Linux itself as a title (docs/linux.md): the kernel tools/build-linux.sh builds from kernel.org's source, lifted with
# the busybox of its initramfs into one module, on the machine rt/microvm-x64 imitates. /init's programs print what
# they print on QEMU (traces/programs.txt). No sha256: built on this machine from checked sources, the files'
# bytes depend on the compiler's.
name = "linux"
from = "base/microvm-x64:1"

[source]
file = "../../out/linux/root"
extract = "folder"
app = "/"

[run]
exe = "/vmlinux"
initrd = "/initramfs.cpio"
cmdline = "console=ttyS0,115200 earlyprintk=serial,ttyS0,115200 panic=-1 no_timer_check vdso=0 tsc=reliable 8250.nr_uarts=1"

[lifter]
split = 16
programs = ["/busybox", "/hello", "/fastfetch", "/perl"]
