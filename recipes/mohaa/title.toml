# The recipe for the Medal of Honor: Allied Assault single-player demo (2001, 2015 Inc. / Electronic Arts; id Tech 3,
# OpenGL): `pisco build recipes/mohaa --source mohaaspdemo.zip` makes its image (docs/images.md). What is known of the
# title: docs/mohaa.md.
name = "mohaa"
from = "base/windows-x86:1"

[source]
# the user's own copy of the demo's download: a zip around a Wise installer, which carries an InstallShield 6 setup.
# Never stored in the repository, nor in any image that leaves the machine
file = "mohaaspdemo.zip"
sha256 = "236e23d9bcf07ac9a6b5a862a4b6f25f5566ceeab4072278b54407e9ffc22197"
extract = "wise"
app = 'C:\Program Files\EA GAMES\MOHAADemo'

[source.installshield.groups]
# where the setup's file groups go below the title's folder, as the setup puts them under Wine ('-': not installed;
# the <Engine>, <Support> and <Disk1> groups are the setup's own files)
"Program Executable Files" = ''
"Data Files Minimal" = 'main'
"Data Files Complete" = 'main'
"Program DLLs" = 'main'
"Program DLLs2" = 'main'
"SoundDriver Files" = 'snddrivers'
"Video Files" = 'main\video'
"Music Files" = 'main\sound\music'
"Sound Files" = 'main\sound'
"Sound Amb Files" = 'main\sound\amb'
"Sound AmbStereo Files" = 'main\sound\amb_stereo'
"Sound Mechanics Files" = 'main\sound\mechanics'
"Sound Dialogue Files" = 'main\sound\dialogue'
"Sound Weapons Files" = 'main\sound\weapons'
"DirectX8 Files" = 'redist\directx8'
"Help Files EN-US" = 'eReg'
"eReg Files" = 'eReg'
"Redist Files" = 'redist'
"CD Only Files" = '-'
"Example Files" = '-'
"Shared DLLs" = '-'
"<Engine>Engine Files" = '-'
"<Engine>Kernel Placeholder" = '-'
"<Engine>ScriptEngine" = '-'
"<Engine>SelfRegistering" = '-'
"<Support>Script" = '-'
"<Support>Language Independent OS Independent Files" = '-'
"<Support>Language Independent Intel 32 Files" = '-'
"<Support>English OS Independent Files" = '-'
"<Support>English Intel 32 Files" = '-'
"<Support>English String Tables" = '-'
"<Support>Non-SelfRegistering" = '-'
"<Support>English Files" = '-'
"<Disk1>Disk1 Files(1)" = '-'
"<Disk1>Disk1 Files(2)" = '-'
"<Disk1>Disk1 Files(3)" = '-'

[run]
exe = 'C:\Program Files\EA GAMES\MOHAADemo\MOHAADemo.exe'
display = "800x600"   # the engine's default mode 4, full screen, as the oracle runs it

[lifter]
split = 16
entries = []
