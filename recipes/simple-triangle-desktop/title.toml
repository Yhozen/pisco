# SPDX-License-Identifier: GPL-2.0-or-later
# Microsoft's SimpleTriangleDesktop (Xbox-GDK-Samples, MIT), a Windows x64 desktop title, as the user builds it
# (tools/build-gdk-sample.sh) and tests/gfx/st.sh stages it with the MSVC runtime DLLs beside it (out/st-game/local).
# Nothing of Microsoft's is in this repository: the folder is the user's.
name = "simple-triangle-desktop"
from = "base/windows-x64:1"

[source]
file = "../../out/st-game/local"
extract = "folder"

[run]
exe = 'C:\Program Files\SimpleTriangleDesktop\SimpleTriangleDesktop.exe'
display = "1920x1080"
