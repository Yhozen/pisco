# The recipe for Tag: The Power of Paint (2008, DigiPen; Direct3D 9): `pisco build recipes/tag --source <installer>`
# makes its image (docs/images.md). What is known of the app so far: docs/tag.md (milestone T0 of the plan). The
# image runs with D3DX lifted beside it and the runtime's FMOD Ex (milestones T1 to T6 of the plan).
schema = 1
name = "tag"
from = "base/windows-x86:1"
libraries = ["d3d9", "dinput8", "fmodex"]   # checked against the app's imports

[about]
display_name = "Tag: The Power of Paint"
revision = 1

[[input]]
# the user's own installer: never stored in the repository, nor in any image that leaves the machine
id = "installer"
file = "Tag_setup.exe"
sha256 = "bb69d916e788c6a658e4b75e945efd6960ce4ddef1f5cc0ce6db86efccbe8113"
where = "DigiPen's download of the game: Tag_setup.exe"

[[extract]]
kind = "innosetup"
input = "installer"
app = 'C:\Program Files\Tag'

[[extract]]
kind = "cab"
# Microsoft's D3DX, which the installer leaves to DXSETUP: taken out of its cabinet into system32, as DXSETUP puts
# it there. The app's shaders are compiled at run time by this DLL's HLSL compiler (docs/tag.md)
from = 'C:\Program Files\Tag\DirectX\AUG2007_d3dx9_35_x86.cab'
files = ["d3dx9_35.dll"]
to = 'C:\WINDOWS\system32'

[run]
exe = 'C:\Program Files\Tag\Tag.exe'
display = "1024x768"   # Game Data\TAG.ini: full screen (bWindowed = 0) at 1024x768, as the oracle runs it

[cpu]
# As for Narbacular Drop: d3dx9_35.dll has hand-written MMX and 3DNow paths the lifter does not take (7727 of its
# instructions, docs/tag.md); on a Pentium without MMX it runs its plain x87 code
features = ["fpu", "tsc", "cx8"]

[registry]
# D3DX's switches for its processor-specific code, all off (as for Narbacular Drop)
'HKLM\Software\Microsoft\Direct3D' = { DisableMMX = 1, DisablePSGP = 1, DisableD3DXPSGP = 1 }

[dll]
# the shipped fmodex.dll is UPX-packed; the runtime's own FMOD Ex answers instead (rt/windows-x86/fmodex.c)
"fmodex.dll" = "builtin"

[hints.pisco]
split = 16    # the lifted C in 16 files: compiled in parallel
