# The oracle's sound device (oracle.sh sound): one PipeWire daemon, run as the user, with no hardware. A null sink
# paced by PipeWire's dummy driver (a timer: it consumes 48,000 frames a second, as a sound card would), and the
# PulseAudio protocol in the same process, which Wine's winepulse.drv talks to. wireplumber links the streams.
# The sink's monitor is what ffmpeg records (-f pulse -i sw-null.monitor): what Wine played.
context.properties = { core.daemon = true core.name = pipewire-0 default.clock.rate = 48000 default.clock.allowed-rates = [ 48000 ] }
context.spa-libs = { audio.convert.* = audioconvert/libspa-audioconvert audio.adapt = audioconvert/libspa-audioconvert support.* = support/libspa-support }
context.modules = [
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-metadata }
  { name = libpipewire-module-spa-node-factory }
  { name = libpipewire-module-client-node }
  { name = libpipewire-module-access }
  { name = libpipewire-module-adapter }
  { name = libpipewire-module-link-factory }
  { name = libpipewire-module-protocol-pulse }
]
pulse.properties = { server.address = [ "unix:native" ] }
context.objects = [
  { factory = metadata args = { metadata.name = default } }
  { factory = spa-node-factory args = { factory.name = support.node.driver node.name = Dummy-Driver node.group = pipewire.dummy priority.driver = 20000 } }
  { factory = adapter args = { factory.name = support.null-audio-sink node.name = sw-null node.description = "pisco null sink"
      media.class = Audio/Sink audio.position = [ FL FR ] audio.rate = 48000 monitor.channel-volumes = true object.linger = true } }
]
